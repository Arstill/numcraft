    group: aluminum
    hardness: "HB 150"
    kc: 850
    coolant: "СОЖ (эмульсия) поливом, M08"
    milling:
      vc: {adaptive: 380, slot: 300, pocket: 350, finish: 420, contour: 380}
      fz_k: 0.0075
      fz_min: 0.02
      fz_max: 0.14
      adaptive_ae: 0.15
      adaptive_ap: 3.0
      slot_ap: 0.5
      pocket_ae: 0.45
      pocket_ap: 1.0
      finish_ae_mm: 0.25
      ramp_angle_deg: 3
      leave_radial: 0.40
      leave_axial: 0.20
      chip_thinning_max: 1.8
    face_mill: {vc: 700, fz: 0.12, ap: 2.0, ap_finish: 0.3}
    drill: {vc: 120, f_k: 0.022, f_max: 0.35, vc_hss: 50}
    spot_drill: {vc: 90, f_rev: 0.06}
    tap: {vc: 12}
    reamer: {vc: 35, f_k: 0.03}
